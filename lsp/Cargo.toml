[package]
name = "strata_lsp"
version = "0.1.0"
edition = "2021"
authors = ["Strata Contributors"]
license = "MIT"
description = "Strata Language Server Protocol (LSP 3.17) implementation in pure Rust"
repository = "https://github.com/strataui/vscode"

[[bin]]
name = "strata-lsp"
path = "src/main.rs"

[lib]
name = "strata_lsp"
path = "src/lib.rs"

[dependencies]
strata_style = { git = "https://github.com/strataui/strata.git" }
strata_ui = { git = "https://github.com/strataui/strata.git" }
strata_primitives = { git = "https://github.com/strataui/strata.git" }
strata_js = { git = "https://github.com/strataui/strata.git" }
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
