[package]
name = "strata-lsp"
version = "0.1.0"
edition = "2021"
authors = ["Strata Contributors"]
license = "MIT"
description = "Strata Language Server Protocol (LSP 3.17) implementation in pure Rust"
repository = "https://github.com/strataui/vscode"
homepage = "https://github.com/strataui/vscode"
documentation = "https://docs.rs/strata-lsp"
keywords = ["lsp", "language-server", "strata", "tailwind", "rsx"]
categories = ["development-tools"]

[[bin]]
name = "strata-lsp"
path = "src/main.rs"

[lib]
name = "strata_lsp"
path = "src/lib.rs"

[dependencies]
strata-style = "0.1.1"
strata-components = "0.1.3"
strata-primitives = "0.1.0"
tree-sitter = "0.27.2"
tree-sitter-rust = "0.24.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.dev]
opt-level = 1
